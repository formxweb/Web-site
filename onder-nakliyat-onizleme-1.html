[{id:"fiyat",question:"Nakliyat fiyat\u0131 nas\u0131l belirleniyor?",answer:"Fiyat; e\u015Fya miktar\u0131, ta\u015F\u0131nma mesafesi, \xE7\u0131k\u0131\u015F ve var\u0131\u015F adreslerindeki kat ve asans\xF6r durumu, paketleme ihtiyac\u0131 ve ta\u015F\u0131nma tarihi gibi etkenlere g\xF6re belirlenir. Her ta\u015F\u0131nma farkl\u0131 oldu\u011Fu i\xE7in sabit bir liste yerine bilgilerinize g\xF6re size \xF6zel teklif haz\u0131rl\u0131yoruz. Ta\u015F\u0131nma Planlay\u0131c\u0131\u2019y\u0131 doldurarak \xFCcretsiz teklif alabilirsiniz."},{id:"sehirlerarasi",question:"\u015Eehirler aras\u0131 ta\u015F\u0131ma yap\u0131yor musunuz?",answer:"Evet. \u015Eehir i\xE7i ta\u015F\u0131malar\u0131n yan\u0131 s\u0131ra \u015Fehirler aras\u0131 ev ve ofis ta\u015F\u0131mac\u0131l\u0131\u011F\u0131 da yap\u0131yoruz. Rota, y\xFCkleme ve teslim zamanlamas\u0131 ta\u015F\u0131nma \xF6ncesinde planlan\u0131r ve sizinle payla\u015F\u0131l\u0131r."},{id:"paketleme",question:"E\u015Fyalar nas\u0131l paketleniyor?",answer:"Her e\u015Fya t\xFCr\xFCne uygun y\xF6ntemle paketlenir: k\u0131r\u0131lacaklar ayr\u0131ca korunur, mobilya y\xFCzeyleri \xF6rt\xFCl\xFCr, k\xFC\xE7\xFCk e\u015Fyalar kolilenip odalara g\xF6re etiketlenir. Paketlemenin kapsam\u0131n\u0131 teklif a\u015Famas\u0131nda birlikte netle\u015Ftiriyoruz; isterseniz bir k\u0131sm\u0131n\u0131 kendiniz de haz\u0131rlayabilirsiniz."},{id:"asansor",question:"Asans\xF6rl\xFC ta\u015F\u0131ma gerekli mi?",answer:"Her ta\u015F\u0131nmada gerekmez. Y\xFCksek katlarda, dar merdivenli binalarda veya merdivenden ge\xE7mesi zor b\xFCy\xFCk e\u015Fyalarda d\u0131\u015F cephe asans\xF6r\xFC s\xFCreci kolayla\u015Ft\u0131r\u0131r. Gerekip gerekmedi\u011Fini bina ve sokak ko\u015Fullar\u0131na g\xF6re birlikte de\u011Ferlendiriyoruz."},{id:"hazirlik",question:"Ta\u015F\u0131nmadan \xF6nce ne haz\u0131rlamal\u0131y\u0131m?",answer:"Ta\u015F\u0131mak istemedi\u011Finiz e\u015Fyalar\u0131 \xF6nceden ay\u0131rman\u0131z, de\u011Ferli e\u015Fyalar\u0131n\u0131z\u0131 ve \xF6nemli belgelerinizi yan\u0131n\u0131zda ta\u015F\u0131man\u0131z ve iki binan\u0131n y\xF6netimine ta\u015F\u0131nma g\xFCn\xFCn\xFC bildirmeniz s\xFCreci kolayla\u015Ft\u0131r\u0131r. Asans\xF6r ve ara\xE7 park yeri kullan\u0131m\u0131yla ilgili bina kurallar\u0131n\u0131 \xF6nceden \xF6\u011Frenmek de faydal\u0131 olur."},{id:"ofis",question:"Ofis ta\u015F\u0131ma yap\u0131yor musunuz?",answer:"Evet. Ofis ta\u015F\u0131malar\u0131nda i\u015F s\xFCreklili\u011Fini \xF6nceliklendiriyor, ta\u015F\u0131may\u0131 \xE7al\u0131\u015Fma d\xFCzeninize uygun zamana planl\u0131yoruz. Masa, ar\u015Fiv ve ekipmanlar etiketlenerek yeni ofiste do\u011Fru yere yerle\u015Ftirilir."},{id:"parca",question:"Par\xE7a e\u015Fya ta\u015F\u0131yor musunuz?",answer:"Evet. Tek bir koltuk, beyaz e\u015Fya ya da birka\xE7 koli gibi komple ta\u015F\u0131nma gerektirmeyen i\u015Fler i\xE7in de hizmet veriyoruz. Planlay\u0131c\u0131da \u201CPar\xE7a E\u015Fya\u201D se\xE7ene\u011Fini i\u015Faretleyip e\u015Fyalar\u0131 k\u0131saca yazman\u0131z yeterli."},{id:"depolama",question:"Depolama hizmetiniz var m\u0131?",answer:"Evet. Yeni adresiniz haz\u0131r olana kadar ya da yer a\xE7mak istedi\u011Finiz d\xF6nemlerde e\u015Fyalar\u0131n\u0131z\u0131n saklanmas\u0131 i\xE7in depolama \xE7\xF6z\xFCm\xFC sunuyoruz. S\xFCre ve kapsam, ihtiyac\u0131n\u0131za g\xF6re teklif a\u015Famas\u0131nda belirlenir."}];function Yp(t){return t.map(a=>Ji.find(r=>r.id===a)).filter(a=>!!a)}var k2=t=>(t??"").trim();var v2=(k2(void 0)||"").replace(/\D/g,""),vo=k2(void 0)||"",xo="https://www.instagram.com/onderanakliyat_.ltd/",Ii=(k2(void 0)||""||"http://localhost:3000").replace(/\/+$/,""),N={name:"\xD6nder Nakliyat",legalName:"",instagramHandle:"onderanakliyat_.ltd",instagramUrl:xo,phone:vo,whatsapp:v2,email:k2(void 0),address:{street:"",district:"",city:"",postalCode:""},serviceArea:"",workingHours:"",mapsUrl:"",foundingYear:"",mersisNo:"",taxOffice:""},Vc=!1;var _v="Merhaba, ta\u01
